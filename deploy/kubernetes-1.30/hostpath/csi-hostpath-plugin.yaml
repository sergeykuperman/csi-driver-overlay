kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-hostpathplugin
  namespace: default
  labels:
    app.kubernetes.io/instance: hostpath.csi.k8s.io
    app.kubernetes.io/part-of: csi-driver-host-path
    app.kubernetes.io/name: csi-hostpathplugin
    app.kubernetes.io/component: plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: hostpath.csi.k8s.io
      app.kubernetes.io/part-of: csi-driver-host-path
      app.kubernetes.io/name: csi-hostpathplugin
      app.kubernetes.io/component: plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hostpath.csi.k8s.io
        app.kubernetes.io/part-of: csi-driver-host-path
        app.kubernetes.io/name: csi-hostpathplugin
        app.kubernetes.io/component: plugin
    spec:
      serviceAccountName: csi-hostpathplugin-sa
      nodeSelector:
        "com.sap.devx.group/type": "workspaces"
      tolerations:
      - key: WorkGroup
        operator: Equal
        value: "ws"
        effect: NoExecute
      - key: WorkGroup
        operator: Equal
        value: "ws"
        effect: NoSchedule
      initContainers:
        # InitContainer that copies golden image to node-local cache
        - name: golden-image-cache
          image: 407233961683.dkr.ecr.eu-north-1.amazonaws.com/overlay-csi@sha256:76c6ba7bed26810d56aa7944cfffce776c8819faea95685943737bcdfd4c4dec
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Checking golden image cache..."
              CACHE_DIR="/var/lib/overlay-csi/golden-image"
              MARKER_FILE="$CACHE_DIR/.populated"
              if [ -f "$MARKER_FILE" ]; then
                echo "Cache already populated, skipping copy"
              else
                echo "Populating cache from golden image..."
                mkdir -p "$CACHE_DIR"
                cp -a /golden-image/. "$CACHE_DIR/"
                touch "$MARKER_FILE"
                echo "Cache populated successfully"
              fi
              echo "Cache contents:"
              ls -la "$CACHE_DIR" | head -20
          volumeMounts:
            - name: golden-image
              mountPath: /golden-image
              readOnly: true
            - name: overlay-cache
              mountPath: /var/lib/overlay-csi
      containers:
        - name: hostpath
          image: 407233961683.dkr.ecr.eu-north-1.amazonaws.com/overlay-csi@sha256:76c6ba7bed26810d56aa7944cfffce776c8819faea95685943737bcdfd4c4dec
          args:
            - "--drivername=overlay.csi.io"
            - "--v=5"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--nodeid=$(KUBE_NODE_NAME)"
            # end hostpath args
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          ports:
          - containerPort: 9898
            name: healthz
            protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 2
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
              name: mountpoint-dir
            - mountPath: /var/lib/kubelet/plugins
              mountPropagation: Bidirectional
              name: plugins-dir
            - mountPath: /csi-data-dir
              name: csi-data-dir
            - mountPath: /dev
              name: dev-dir
            - mountPath: /var/lib/overlay-csi
              name: overlay-cache

        # csi-external-health-monitor-controller removed - not needed for ephemeral overlay driver

        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi-overlay/csi.sock
          securityContext:
            # This is necessary only for systems with SELinux, where
            # non-privileged sidecar containers cannot access unix domain socket
            # created by privileged CSI driver container.
            privileged: true
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          volumeMounts:
          - mountPath: /csi
            name: socket-dir
          - mountPath: /registration
            name: registration-dir
          - mountPath: /csi-data-dir
            name: csi-data-dir

        - name: liveness-probe
          volumeMounts:
          - mountPath: /csi
            name: socket-dir
          image: registry.k8s.io/sig-storage/livenessprobe:v2.17.0
          args:
          - --csi-address=/csi/csi.sock
          - --health-port=9898

        # csi-attacher removed - not needed for ephemeral overlay driver
        # csi-provisioner removed - not needed for ephemeral overlay driver
        # csi-resizer removed - not needed for ephemeral overlay driver
        # csi-snapshotter removed - not needed for ephemeral overlay driver

        # end csi containers

      volumes:
        - hostPath:
            path: /var/lib/kubelet/plugins/csi-overlay
            type: DirectoryOrCreate
          name: socket-dir
        - hostPath:
            path: /var/lib/kubelet/pods
            type: DirectoryOrCreate
          name: mountpoint-dir
        - hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
          name: registration-dir
        - hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
          name: plugins-dir
        - hostPath:
            # 'path' is where PV data is persisted on host.
            # using /tmp is also possible while the PVs will not available after plugin container recreation or host reboot
            path: /var/lib/csi-hostpath-data/
            type: DirectoryOrCreate
          name: csi-data-dir
        - hostPath:
            path: /dev
            type: Directory
          name: dev-dir
        - hostPath:
            path: /var/lib/overlay-csi
            type: DirectoryOrCreate
          name: overlay-cache
        - name: golden-image
          image:
            reference: 407233961683.dkr.ecr.eu-north-1.amazonaws.com/my-ecr@sha256:e1ea159ecfe30cb234186c5ea3f0966acc9e7f1dee775f42e758ad2d7965da9f
            pullPolicy: IfNotPresent
        # end csi volumes
